<!doctype html>
<html lang="es">
<head>
<!-- SIG-UTP servido por Apps Script: la interfaz se carga desde GitHub Pages y los datos van a esta Hoja con
     google.script.run (Google identifica la cuenta del colegio; no requiere Google Cloud).
     Si la app se publica en otra dirección, cambia BASE y las URLs de abajo. -->
<base href="https://for-mi-da-ble.github.io/utp-C/">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="https://for-mi-da-ble.github.io/utp-C/css/app.css">
<link rel="icon" href="https://for-mi-da-ble.github.io/utp-C/icons/icon.svg" type="image/svg+xml">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#hoy"><img src="https://for-mi-da-ble.github.io/utp-C/icons/escudo.png" alt="Escudo Colegio Marina de Chile" width="30" height="38"><span><b>SIG-UTP</b><small id="brand"></small></span></a>
    <nav id="nav" class="nav" aria-label="Secciones"></nav>
    <div class="tools"><div id="sync" class="sync" role="status"></div><a class="ibtn" href="#config" aria-label="Configuración"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></span></a></div>
  </header>

  <main id="view"></main>
</div>
<nav id="bnav" class="bnav" aria-label="Secciones"></nav>
<div id="login" class="login" hidden><div class="card"><div id="gbtn"></div></div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="dl-func"></datalist>
<script>
  window.SIG_CONFIG = { BASE: 'https://for-mi-da-ble.github.io/utp-C/', API_URL: '', GOOGLE_CLIENT_ID: '', COLEGIO: 'Colegio Marina de Chile', ANIO: 2026 };
</script>
<script type="module" src="https://for-mi-da-ble.github.io/utp-C/js/app.js"></script>
